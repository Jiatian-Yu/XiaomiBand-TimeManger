<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="TimeManager">
  <title>TimeManager</title>
  <defs>
    <linearGradient id="v1-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3E9BFF"/>
      <stop offset=".5" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#5B4BF5"/>
    </linearGradient>
    <radialGradient id="v1-shine" cx=".26" cy=".14" r=".8">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="v1-arc" gradientUnits="userSpaceOnUse" x1="120" y1="140" x2="392" y2="430">
      <stop offset="0" stop-color="#FFD60A"/>
      <stop offset="1" stop-color="#FF8A00"/>
    </linearGradient>
    <clipPath id="v1-clip">
      <rect x="16" y="16" width="480" height="480" rx="108"/>
    </clipPath>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#v1-bg)"/>
  <g clip-path="url(#v1-clip)">
    <rect x="16" y="16" width="480" height="480" fill="url(#v1-shine)"/>
  </g>

  <!-- 表冠 + 表把 -->
  <rect x="240" y="92" width="32" height="46" rx="12" fill="#ffffff"/>
  <rect x="224" y="58" width="64" height="46" rx="17" fill="#ffffff"/>

  <!-- 计时进度环 -->
  <g fill="none" stroke-width="28" transform="rotate(-70 256 286)">
    <circle cx="256" cy="286" r="154" stroke="#ffffff" stroke-opacity=".28"/>
    <circle cx="256" cy="286" r="154" stroke="url(#v1-arc)" stroke-linecap="round" stroke-dasharray="698.4 967.6"/>
  </g>

  <!-- 对勾 -->
  <path d="M189 287 L237 335 L323 237" fill="none" stroke="#ffffff" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="TimeManager">
  <title>TimeManager</title>
  <defs>
    <linearGradient id="v4-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3E9BFF"/>
      <stop offset=".5" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#5B4BF5"/>
    </linearGradient>
    <radialGradient id="v4-shine" cx=".26" cy=".14" r=".8">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="v4-arc" gradientUnits="userSpaceOnUse" x1="120" y1="140" x2="392" y2="430">
      <stop offset="0" stop-color="#FFD60A"/>
      <stop offset="1" stop-color="#FF8A00"/>
    </linearGradient>
    <clipPath id="v4-clip">
      <rect x="16" y="16" width="480" height="480" rx="108"/>
    </clipPath>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#v4-bg)"/>
  <g clip-path="url(#v4-clip)">
    <rect x="16" y="16" width="480" height="480" fill="url(#v4-shine)"/>
  </g>

  <g fill="none" stroke-width="30" transform="rotate(-70 256 256)">
    <circle cx="256" cy="256" r="164" stroke="#ffffff" stroke-opacity=".28"/>
    <circle cx="256" cy="256" r="164" stroke="url(#v4-arc)" stroke-linecap="round" stroke-dasharray="743.9 1030.4"/>
  </g>

  <path d="M188 258 L236 306 L326 206" fill="none" stroke="#ffffff" stroke-width="36"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
